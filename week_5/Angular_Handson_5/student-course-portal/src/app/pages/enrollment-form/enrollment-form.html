<div class="enrollment-container">

  <h2>Student Enrollment Request</h2>

  <form
    #enrollForm="ngForm"
    (ngSubmit)="onSubmit(enrollForm)"
    novalidate>

    <!-- Student Name -->
    <div class="form-group">

      <label for="studentName">Student Name:</label>

      <input
        type="text"
        id="studentName"
        name="studentName"
        [(ngModel)]="enrollment.studentName"
        #nameCtrl="ngModel"
        required
        minlength="3">

      <span
        class="error"
        *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">
        Name is required.
      </span>

      <span
        class="error"
        *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">
        Name must be at least 3 characters.
      </span>

    </div>


    <!-- Student Email -->
    <div class="form-group">

      <label for="studentEmail">Student Email:</label>

      <input
        type="email"
        id="studentEmail"
        name="studentEmail"
        [(ngModel)]="enrollment.studentEmail"
        #emailCtrl="ngModel"
        required
        email>

      <span
        class="error"
        *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">
        Email is required.
      </span>

      <span
        class="error"
        *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">
        Enter a valid email address.
      </span>

    </div>


    <!-- Course ID -->
    <div class="form-group">

      <label for="courseId">Course ID:</label>

      <input
        type="number"
        id="courseId"
        name="courseId"
        [(ngModel)]="enrollment.courseId"
        #courseCtrl="ngModel"
        required>

      <span
        class="error"
        *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">
        Course ID is required.
      </span>

    </div>


    <!-- Preferred Semester -->
    <div class="form-group">

      <label for="preferredSemester">
        Preferred Semester:
      </label>

      <select
        id="preferredSemester"
        name="preferredSemester"
        [(ngModel)]="enrollment.preferredSemester"
        #semesterCtrl="ngModel"
        required>

        <option value="">Select Semester</option>
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>

      </select>

      <span
        class="error"
        *ngIf="semesterCtrl.touched && semesterCtrl.errors?.['required']">
        Preferred semester is required.
      </span>

    </div>


    <!-- Agree to Terms -->
    <div class="checkbox-group">

      <input
        type="checkbox"
        id="agreeToTerms"
        name="agreeToTerms"
        [(ngModel)]="enrollment.agreeToTerms"
        #termsCtrl="ngModel"
        required>

      <label for="agreeToTerms">
        Agree to Terms
      </label>

    </div>

    <span
      class="error terms-error"
      *ngIf="termsCtrl.touched && termsCtrl.invalid">
      You must agree to the terms.
    </span>


    <!-- Buttons -->
    <div class="button-group">

      <button
        type="submit"
        class="submit-btn"
        [disabled]="enrollForm.invalid">
        Submit Enrollment
      </button>

      <button
        type="button"
        class="reset-btn"
        (click)="resetForm(enrollForm)">
        Reset
      </button>

    </div>


    <!-- Success Message -->
    <div
      class="success-message"
      *ngIf="submitted">
      Enrollment request submitted successfully!
    </div>

  </form>

</div>
